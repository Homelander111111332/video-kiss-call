name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SIGNALING_URL: ${{ vars.VITE_SIGNALING_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check signaling server URL
        run: |
          if [ -z "$VITE_SIGNALING_URL" ]; then
            echo "Missing repository variable VITE_SIGNALING_URL."
            echo "Set it to the public HTTPS URL of your Socket.IO signaling server."
            exit 1
          fi

          case "$VITE_SIGNALING_URL" in
            https://*) ;;
            *)
              echo "VITE_SIGNALING_URL must use HTTPS and point to the signaling server, not GitHub Pages."
              exit 1
              ;;
          esac

      - name: Build for GitHub Pages
        run: |
          npx tsc -b
          npx vite build --base=/video-kiss-call/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
